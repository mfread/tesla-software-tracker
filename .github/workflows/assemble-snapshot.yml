name: Assemble Snapshot from Chunks

on:
  push:
    paths:
      - 'chunks/STITCH'
      - '.github/workflows/assemble-snapshot.yml'
  workflow_dispatch:

concurrency:
  group: assemble-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Assemble and validate
        run: |
          set -euo pipefail
          for year in 2025 2026; do
            chunk_dir="chunks/${year}"
            out="snapshot-${year}.json"
            if [[ ! -d "$chunk_dir" ]]; then
              echo "No chunk dir for ${year}"
              continue
            fi
            mapfile -t chunks < <(find "$chunk_dir" -name '[0-9][0-9].txt' | sort)
            if [[ ${#chunks[@]} -eq 0 ]]; then
              echo "No numbered chunks for ${year}"
              continue
            fi
            echo "Assembling ${out} from ${#chunks[@]} chunks"
            cat "${chunks[@]}" > "${out}"
            OUT_PATH="${out}" YEAR="${year}" python3 - << 'PY'
          import json, os, sys
          path = os.environ["OUT_PATH"]
          year = os.environ["YEAR"]
          size = os.path.getsize(path)
          try:
              with open(path) as f:
                  data = json.load(f)
          except Exception as e:
              print(f"SKIP {path}: not valid JSON ({e})")
              os.remove(path)
              sys.exit(0)
          tree = data.get("tree") or {}
          kids = tree.get("children")
          bad = None
          if size < 10000:
              bad = f"too small ({size} bytes)"
          elif not isinstance(kids, list) or len(kids) < 5:
              bad = "tree.children missing or too short"
          elif year == "2026" and len(kids) < 10:
              bad = f"2026 trunk count {len(kids)} < 10"
          elif "meta" not in data:
              bad = "missing meta"
          else:
              text = open(path).read()
              if "PLACEHOLDER" in text or "FULL_CONTENT_FROM_FILE" in text:
                  bad = "placeholder text"
              else:
                  def verkey(v):
                      return ".".join(str(p).zfill(4) for p in str(v or "").split("."))
                  first = verkey(kids[0].get("version") or kids[0].get("name"))
                  last = verkey(kids[-1].get("version") or kids[-1].get("name"))
                  if first > last:
                      bad = "trunks not oldest-first"
          if bad:
              print(f"SKIP {path}: {bad}. Existing snapshot left untouched.")
              os.remove(path)
              sys.exit(0)
          print(f"OK {path}: {size} bytes, {len(kids)} children")
          PY
            if [[ -f "${out}" && "${year}" == "2026" ]]; then
              cp "${out}" snapshot.json
              echo "Updated snapshot.json from 2026"
            fi
          done

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f snapshot-2026.json snapshot-2025.json snapshot.json || true
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Assemble live snapshots from chunks [skip ci]"
          git push
